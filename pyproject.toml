[project]
name = "clickshare-temperature"
version = "0.1.0"
description = "Gather temperature readings from Barco ClickShare devices"
readme = "README.md"
license = "MIT"
authors = [
    { name = "nocarryr", email = "matt@nomadic-recording.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "click>=8.3.3",
    "python-dotenv>=1.2.2",
    "yarl>=1.23.0",
]

[project.scripts]
clickshare-temperature = "clickshare_temperature:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.mypy]
packages = ["clickshare_temperature"]

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py"]


[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "ruff>=0.15.12",
]
